syntax = "proto3";

package master;

option go_package = "github.com/mapreduce_impl/rpc";

service MasterService {
  rpc WorkerRegister(WorkerRegisterRequest) returns (WorkerRegisterReply);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
}

// worker 向 master 发送自己的标识信息和地址
message WorkerRegisterRequest {
  string uuid = 1;
  string address = 2;
}

// Map 阶段需要 NReduce 计算分区：partition = hash(key) % nReduce。相同的 key 进入相同的 分区
message WorkerRegisterReply {
  bool ok = 1;
  string master_id = 2;
}



message HeartbeatRequest {
  string uuid = 1;
  int32 current_task = 2;  // 正在执行的 task id
  bool request_task = 3;  // 是否请求新任务 

}

message HeartbeatReply {
  bool ok = 1;
  oneof TaskInfo {
    MapTaskInfo map_task_info = 2;
    ReduceTaskInfo reduce_task_info = 3;
  }
}




// type MapTaskInfo struct {
// 	ID int
//
// 	// 任务状态
// 	Status common.TaskStatus
//
// 	// 输入(大型文件系统通常分块存储，需要按偏移读取)
// 	DataNode string
// 	Block int
// 	StartIndex   int
// 	Size  int // EndOfset - StartOffset
//
// 	// 输出到 Worker 普通本地磁盘
// 	IntermediateDir string
// 	NReduce         int // 计算分区（输出文件）数量
//
// 	// 执行 worker 编号
// 	WorkerID string
//
// 	//开始时间和结束时间戳
// 	StartTime time.Time
// 	EndTime   time.Time
// }


message MapTaskInfo {
  int32 ID = 1;
  Status status = 2;
  string datanode = 3;
  int32 block = 4;
  int32 start_index = 5;
  int32 size = 6;
  string intermediate_dir = 7;
  int32 n_reduce = 8;
}



// type ReduceTaskInfo struct {
// 	ID int
//
// 	// 任务状态
// 	Status common.TaskStatus
//
// 	// 输入(文件地址 和 待处理的分区)
// 	ReduceIndex int
//
// 	// 输出
// 	OutputDir string
//
// 	// 执行 worker 编号
// 	WorkerID string
//
// 	//开始时间和结束时间戳
// 	PullDataStartTime time.Time
// 	PullDataEndTime   time.Time
// 	ReduceStartTime   time.Time
// 	ReduceEndTime     time.Time
// }
message ReduceTaskInfo {
  int32 ID = 1;
  Status status = 2;
  int32 partition_index = 3;
  string output_dir = 4;
}


enum Status {
  Idle = 0;
  Running = 1;
  Completed = 2;
  Fatal = 3;
}
